<style>
:root{
  --cream:#F6F0E1; --card:#FFFCF2; --ink:#141414; --soft:#56503F;
  --green:#1EC95B; --green-dark:#128A3F; --dark:#0E0E12;
  --radius:14px; --shadow:4px 4px 0 rgba(20,20,20,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink); background-color:var(--cream);
  background-image:radial-gradient(rgba(20,20,20,.13) 1.3px,transparent 1.4px);
  background-size:22px 22px; min-height:100vh; display:flex; flex-direction:column;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
.hidden{display:none!important}
::selection{background:var(--green);color:#04140A}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;
  padding:12px 22px;background:var(--dark);color:#F6F0E1;border-bottom:3px solid var(--green)}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;border-radius:10px;border:2px solid #2A2A33;object-fit:cover}
.brand-name{font-family:'Press Start 2P',monospace;font-size:15px;letter-spacing:1px;color:#fff;white-space:nowrap}
.brand-dot{color:var(--green)}
.nav{display:flex;gap:6px;margin-left:6px}
.nav a{font-weight:600;font-size:14px;padding:8px 12px;border-radius:9px;color:#D9D2BC;border:2px solid transparent}
.nav a:hover{color:#fff;border-color:#2E2E3A}
.nav a.active{color:var(--green);border-color:var(--green)}
.auth-area{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 12px;
  background:#191922;border:2px solid #2E2E3A;border-radius:999px;color:#EDE7D4;max-width:200px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-admin{font-size:8px;font-family:'Press Start 2P',monospace;color:#04140A;background:var(--green);padding:4px 6px;border-radius:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;
  padding:10px 16px;border-radius:11px;border:2px solid var(--ink);
  background:var(--card);color:var(--ink);box-shadow:var(--shadow);
  transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(20,20,20,.9)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(20,20,20,.9)}
.btn-green{background:var(--green);color:#04140A}
.btn-dark{background:var(--dark);color:#F6F0E1;border-color:var(--dark);box-shadow:4px 4px 0 rgba(20,20,20,.35)}
.btn-sm{padding:7px 11px;font-size:12.5px;box-shadow:3px 3px 0 rgba(20,20,20,.9)}
.btn-ghost{box-shadow:none;border-color:#2E2E3A;background:transparent;color:#EDE7D4}
.btn-ghost:hover{border-color:var(--green);color:var(--green);box-shadow:none;transform:none}
.btn svg{flex:none}

/* ---------- layout ---------- */
.app{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:34px 22px 64px}

/* ---------- hero ---------- */
.hero{padding:26px 0 8px}
.kicker{font-family:'Press Start 2P',monospace;font-size:9.5px;display:inline-block;
  background:rgba(30,201,91,.12);border:2px solid var(--green);color:var(--green-dark);
  padding:9px 11px;border-radius:9px;margin-bottom:20px}
h1.mega{font-family:'Press Start 2P',monospace;font-size:clamp(23px,4.6vw,44px);line-height:1.4;letter-spacing:2px}
h1.mega .dot{color:var(--green)}
.tagline{margin-top:18px;font-size:17px;color:var(--soft);max-width:660px;line-height:1.6}
.hero-actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.stats{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.stat{font-size:13px;font-weight:700;border:2px solid var(--ink);background:var(--card);
  padding:8px 14px;border-radius:999px;box-shadow:3px 3px 0 rgba(20,20,20,.9)}
.stat b{color:var(--green-dark)}

/* ---------- toolbar + search ---------- */
.toolbar{display:flex;align-items:center;gap:14px;margin:38px 0 18px;flex-wrap:wrap}
.section-title{font-family:'Press Start 2P',monospace;font-size:13.5px;letter-spacing:1px}
.search{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--card);
  border:2px solid var(--ink);border-radius:11px;padding:9px 13px;box-shadow:var(--shadow);min-width:260px;color:var(--soft)}
.search input{border:none;outline:none;background:transparent;font:inherit;font-size:14px;width:100%;color:var(--ink)}

/* ---------- grid + cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(20,20,20,.9)}
.card-img{position:relative;aspect-ratio:16/9;background:#EDE5CF;border-bottom:2.5px solid var(--ink);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.fav-btn{position:absolute;top:10px;right:10px;width:38px;height:38px;display:grid;place-items:center;
  background:rgba(255,252,242,.95);border:2px solid var(--ink);border-radius:10px;
  box-shadow:2px 2px 0 rgba(20,20,20,.8);transition:transform .12s ease}
.fav-btn svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:2;transition:all .15s}
.fav-btn.on svg{fill:var(--green);stroke:var(--green-dark)}
.fav-btn:hover{transform:scale(1.08)}
.card-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:9px;flex:1}
.card-tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-dark)}
.card-title{font-size:19px;font-weight:700;line-height:1.2}
.card-desc{font-size:13.5px;color:var(--soft);line-height:1.55;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{display:flex;gap:9px;margin-top:5px}
.card-actions .btn{flex:1;justify-content:center}

/* ---------- detail ---------- */
.detail{max-width:880px;margin:0 auto}
.backlink{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin-bottom:18px}
.backlink:hover{color:var(--green-dark)}
.detail-card{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;
  box-shadow:6px 6px 0 rgba(20,20,20,.9);overflow:hidden}
.detail-img{width:100%;aspect-ratio:2/1;object-fit:cover;border-bottom:2.5px solid var(--ink);background:#EDE5CF}
.detail-body{padding:26px 28px 30px}
.detail-body h2{font-size:30px;line-height:1.15;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-desc{margin:16px 0 24px;color:var(--soft);font-size:15.5px;line-height:1.75;white-space:pre-wrap}
.detail-meta{font-size:12.5px;color:#8A836C;margin-top:22px}

/* ---------- forms / panels ---------- */
.panel{max-width:520px;margin:30px auto;background:var(--card);border:2.5px solid var(--ink);
  border-radius:16px;box-shadow:var(--shadow);padding:30px 30px 32px}
.panel h2{font-family:'Press Start 2P',monospace;font-size:15px;margin-bottom:10px;line-height:1.5}
.panel .sub{color:var(--soft);font-size:14px;margin-bottom:22px;line-height:1.55}
.panel h3.pt{font-family:'Press Start 2P',monospace;font-size:12px;margin-bottom:20px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;letter-spacing:.04em}
.field input,.field textarea{width:100%;font:inherit;font-size:14.5px;padding:11px 13px;
  border:2px solid var(--ink);border-radius:10px;background:#FFFDF6;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,201,91,.22)}
.field textarea{min-height:110px;resize:vertical}
.field .hint{font-size:12px;color:#8A836C;margin-top:5px;line-height:1.4}
input[type=color]{width:64px;height:42px;padding:3px;cursor:pointer;border:2px solid var(--ink);border-radius:10px;background:#FFFDF6}
.form-err{background:#FDE8E8;border:2px solid #D64545;color:#8F1F1F;font-size:13.5px;font-weight:600;
  padding:10px 12px;border-radius:9px;margin-bottom:15px}
.form-ok{background:rgba(30,201,91,.13);border:2px solid var(--green);color:var(--green-dark);
  font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:9px;margin-bottom:15px}
.panel-foot{margin-top:18px;font-size:14px;color:var(--soft);text-align:center}
.panel-foot a{color:var(--green-dark);font-weight:700;text-decoration:underline}

/* ---------- admin ---------- */
.admin-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px}
.admin-head h2{font-family:'Press Start 2P',monospace;font-size:19px;margin-top:14px;line-height:1.5}
.tabs{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}
.tab{font-weight:700;font-size:14px;padding:9px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--card)}
.tab.active{background:var(--dark);color:var(--green);border-color:var(--dark)}
.admin-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:start}
.admin-grid>.panel{max-width:none;margin:0}
@media(max-width:880px){.admin-grid{grid-template-columns:1fr}}
.admin-list{display:flex;flex-direction:column;gap:12px}
.admin-row{display:flex;align-items:center;gap:13px;background:var(--card);border:2px solid var(--ink);
  border-radius:12px;padding:10px 12px;box-shadow:3px 3px 0 rgba(20,20,20,.85)}
.admin-row img{width:74px;height:48px;object-fit:cover;border:2px solid var(--ink);border-radius:8px;background:#EDE5CF}
.admin-row .info{flex:1;min-width:0}
.admin-row .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-row .info span{font-size:12px;color:#8A836C}
.row-actions{display:flex;gap:7px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--ink);
  border-radius:9px;background:var(--card);color:var(--ink);transition:all .12s}
.icon-btn:hover{background:var(--green);color:#04140A}
.icon-btn.danger:hover{background:#D64545;color:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.swatch{width:38px;height:38px;border-radius:9px;border:2px solid var(--ink);cursor:pointer;box-shadow:2px 2px 0 rgba(20,20,20,.7)}
.swatch:hover{transform:translateY(-2px)}
.upload-box{border:2px dashed var(--ink);border-radius:12px;padding:18px 14px;text-align:center;background:#FFFDF6;cursor:pointer;transition:background .15s}
.upload-box:hover{background:rgba(30,201,91,.07)}
.upload-box b{font-size:13.5px;display:block}
.upload-box .hint{font-size:12px;color:#8A836C;margin-top:5px}
.preview-img{margin-top:14px;max-height:180px;border:2px solid var(--ink);border-radius:10px;background:#EDE5CF}

/* ---------- empty / misc ---------- */
.empty{text-align:center;padding:58px 20px;border:2.5px dashed rgba(20,20,20,.4);border-radius:16px;background:rgba(255,252,242,.65)}
.empty h3{font-family:'Press Start 2P',monospace;font-size:13px;margin-bottom:14px;line-height:1.6}
.empty p{color:var(--soft);margin-bottom:22px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:99;
  background:var(--dark);color:#F6F0E1;font-weight:600;font-size:14px;padding:13px 20px;
  border:2px solid var(--green);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:all .25s ease;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.warn{border-color:#FFB020}

/* ---------- pixel night footer ---------- */
.night{position:relative;margin-top:auto;background:#050511;border-top:3px solid var(--green);line-height:0;overflow:hidden}
.night canvas{width:100%;max-width:1280px;height:auto;margin:0 auto;display:block;image-rendering:pixelated}
.scene-btns{position:absolute;top:14px;right:16px;display:flex;gap:8px;line-height:1.4;flex-wrap:wrap;justify-content:flex-end}
.scene-btn{font-family:'Press Start 2P',monospace;font-size:8.5px;padding:9px 11px;color:#B9C0E8;
  background:rgba(10,10,26,.85);border:2px solid #30304F;border-radius:8px;transition:all .12s}
.scene-btn:hover{border-color:var(--green);color:var(--green)}
.scene-btn.active{background:var(--green);color:#04140A;border-color:var(--green)}
.night-meta{position:absolute;left:18px;bottom:14px;line-height:1.5;color:#9AA2CE;font-size:12.5px}
.night-meta a{color:var(--green);font-weight:700;display:inline-flex;align-items:center;gap:7px}
.night-meta a:hover{text-decoration:underline}
.night-meta .copy{color:#6A719E;font-size:11.5px;margin-top:3px}
.live-chip{display:inline-flex;align-items:center;gap:7px;margin-left:12px;font-family:'Press Start 2P',monospace;font-size:8px;
  color:var(--green);border:2px solid rgba(30,201,91,.45);border-radius:999px;padding:6px 9px;
  background:rgba(30,201,91,.07);vertical-align:middle;transition:background .2s,color .2s}
.live-chip i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:livepulse 1.4s infinite}
.live-chip.hit{background:var(--green);color:#04140A}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.2}}

@media(max-width:640px){
  .topbar{flex-wrap:wrap;gap:10px;padding:12px 14px}
  .nav{order:3;width:100%;margin-left:0;flex-wrap:wrap}
  .auth-area{margin-left:auto}
  .brand-name{font-size:12px}
  .app{padding:24px 14px 48px}
  .search{min-width:0;width:100%;margin-left:0}
  .scene-btns{top:10px;right:10px}
  .night-meta{left:12px;bottom:10px;font-size:11px}
  .detail-body{padding:20px 18px 24px}
}
</style>
</head>

'use strict';
/* ================= UNFOTABLE — single-file hub =================
   Admin id: devanshu (default password: devanshu123 — change it in
   Admin > Account). All data lives in this browser's localStorage. */

/* ---------- tiny helpers ---------- */
const $  = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hashPw(s){ let h = 9; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 387420489); return (h >>> 0).toString(36) + '.' + s.length; }

  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); if (k !== K.ver) bump(); }
};

/* ---------- live sync core ----------
   Any change saved by devanshu bumps uf_ver. Every other open page of
   the site notices it (BroadcastChannel + storage event + 1s heartbeat)
   and refreshes itself within 1 second — no manual reload needed. */
const bc = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('unfotable_live') : null;
let lastVer = 0;
function bump(){
  const v = Date.now();
  localStorage.setItem(K.ver, JSON.stringify(v));
  lastVer = v;
  try { if (bc) bc.postMessage({ ver: v }); } catch(e){}
}

/* ---------- theme ---------- */
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function applyTheme(){
  const r = document.documentElement.style;
  r.setProperty('--green', theme.accent);
  r.setProperty('--green-dark', shade(theme.accent, .62));
  r.setProperty('--cream', theme.cream);
  r.setProperty('--card', theme.card);
  r.setProperty('--ink', theme.ink);
  $('#brandLogo').src = theme.logo || LOGO_DEFAULT;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, warn){
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('warn', !!warn); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- auth ---------- */
function setUser(u){
  currentUser = u;
  if (u) store.set(K.session, u.u); else localStorage.removeItem(K.session);
  bump(); /* logins/logouts are broadcast live too */
  renderHeader();
}
function login(u, p){
  const us = users.find(x => x.u.toLowerCase() === String(u).toLowerCase());
  if (!us || us.p !== hashPw(p)) return 'Invalid id or password';
  setUser(us); return null;
}
function signup(u, p){
  if (!/^[a-zA-Z0-9_]{3,18}$/.test(u)) return 'Id must be 3-18 letters, numbers or underscores';
  if (String(p).length < 4) return 'Password must be at least 4 characters';
  if (users.some(x => x.u.toLowerCase() === u.toLowerCase())) return 'This id is already taken';
  const nu = { u, p:hashPw(p), admin:false, ts:Date.now() };
  users.push(nu); store.set(K.users, users); setUser(nu); return null;
}
function changePw(oldP, newP){
  if (currentUser.p !== hashPw(oldP)) return 'Current password is wrong';
  if (String(newP).length < 4) return 'New password must be at least 4 characters';
  currentUser.p = hashPw(newP); store.set(K.users, users); return null;
}

  const list = favs[currentUser.u] || (favs[currentUser.u] = []);
  const i = list.indexOf(id);
  if (i >= 0){ list.splice(i, 1); toast('Removed from favorites'); }
  else { list.push(id); toast('Saved to favorites'); }
  store.set(K.favs, favs);
  if ((location.hash.replace(/^#/, '') || '/').indexOf('/favorites') === 0){ render(); return; }

/* ---------- router ---------- */
function render(){
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  renderHeader();
  const app = $('#app');
  window.scrollTo(0, 0);
  if (!parts[0]) return viewHome(app);
  if (parts[0] === 'project' && parts[1]) return viewProject(app, parts[1]);
  if (parts[0] === 'favorites') return viewFavs(app);
  if (parts[0] === 'login') return viewLogin(app);
  if (parts[0] === 'signup') return viewSignup(app);
  if (parts[0] === 'admin') return viewAdmin(app);
  app.innerHTML = emptyView('404', 'This page drifted off the map', 'Go back home', '#/');
}

function resizeImg(file, cb, max){
  max = max || 900;
  const img = new Image(), fr = new FileReader();
  fr.onload = () => { img.onload = () => {
    let w = img.width, h = img.height;
    const sc = Math.min(1, max / Math.max(w, h));
    w = Math.round(w * sc); h = Math.round(h * sc);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', .86));
  }; img.src = fr.result; };
  fr.readAsDataURL(file);
}

function bindProjectForm(){
  const form = $('#pForm');
  const editing = projects.find(p => p.id === editId);
  imgData = '';
  const urlIn = $('#fUrl'), prev = $('#imgPrev');
  const showPrev = src => { if (src){ prev.src = src; prev.style.display = ''; } else prev.style.display = 'none'; };
  urlIn.oninput = () => { imgData = ''; showPrev(urlIn.value.trim()); };
  $('#imgBox').onclick = () => $('#imgFile').click();
  $('#imgFile').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    resizeImg(f, d => { imgData = d; urlIn.value = ''; showPrev(d); toast('Image ready'); });
  };
  if ($('#cancelEdit')) $('#cancelEdit').onclick = () => { editId = null; adminTab('projects'); };
  form.onsubmit = ev => {
    ev.preventDefault();
    const name = $('#fName').value.trim();
    const desc = $('#fDesc').value.trim();
    let link = $('#fLink').value.trim();
    if (!name || !desc){ toast('Name and description are required', true); return; }
    if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    const image = imgData || urlIn.value.trim() || seedImg('#0E0E24', theme.accent, '#2E2E55', 'NEW');
    if (editing){
      editing.name = name; editing.desc = desc; editing.link = link || editing.link;
      editing.image = image;
      toast('Project updated');
    } else {
      projects.unshift({ id:uid(), name, desc, link:link || 'https://github.com/UNFOTABLE01', image, addedBy:currentUser.u, ts:Date.now() });
      toast('Project added');
    }
    store.set(K.projects, projects);
    editId = null;
    adminTab('projects');
  };
}

function adminTabProjects(body){
  body.innerHTML = '<div class="admin-grid"><div class="panel">' + projectFormHTML(projects.find(p => p.id === editId)) + '</div>'
    + '<div><div class="toolbar" style="margin:0 0 14px"><h2 class="section-title" style="font-size:11.5px">LIVE PROJECTS (' + projects.length + ')</h2></div>'
    + '<div class="admin-list">' + (projects.map(adminRowHTML).join('') || '<p class="sub">No projects yet.</p>') + '</div></div></div>';
  bindProjectForm();
  $$('[data-edit]', body).forEach(b => b.onclick = () => { editId = b.dataset.edit; adminTab('projects'); });
  $$('[data-del]', body).forEach(b => b.onclick = () => {
    const p = projects.find(x => x.id === b.dataset.del);
    if (!p) return;
    if (!confirm('Delete "' + p.name + '"? This cannot be undone.')) return;
    projects = projects.filter(x => x.id !== p.id);
    for (const u in favs) favs[u] = (favs[u] || []).filter(id => id !== p.id);
    store.set(K.projects, projects); store.set(K.favs, favs);
    if (editId === p.id) editId = null;
    toast('Project deleted');
    adminTab('projects');
  });
}

<script>
/* ================= PIXEL NIGHT — mountain / city / desert ================= */
(function(){
  const cv = $('#nightCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const HORIZON = 64, GROUND = 86;

  let scene = localStorage.getItem(K.scene) || 'mountain';
  if (!['mountain','city','desert'].includes(scene)) scene = 'mountain';

  /* stars (deterministic-ish spread) */
  const stars = []; let rs = 42;
  const rnd = () => { rs = (rs * 1103515245 + 12345) % 2147483648; return rs / 2147483648; };
  for (let i = 0; i < 74; i++){
    stars.push({ x:(rnd()*W)|0, y:(rnd()*(HORIZON-6))|0, ph:rnd()*6.28, sp:.4+rnd()*1.6, g:rnd()<.16, big:rnd()<.12 });
  }

  /* shooting star */
  const shoot = { on:false, x:0, y:0, vx:0, vy:0, life:0, next:220 };

  /* static geometry */
  const ridge1 = [], ridge2 = [];
  for (let x = 0; x <= W; x += 4) ridge1.push(Math.round(26 + 11*Math.sin(x*.05) + 6*Math.sin(x*.13 + 2)));
  for (let x = 0; x <= W; x += 3) ridge2.push(Math.round(34 + 9*Math.sin(x*.07 + 1) + 7*Math.sin(x*.17 + .5)));

  const trees = [];
  for (let i = 0; i < 15; i++) trees.push({ x:6 + i*17 + ((i*7) % 6), th:8 + ((i*13) % 3)*3 });

  const bldFar = [], bldNear = [];
  (function(){
    let x = 2;
    while (x < W - 6){ const w = 8 + ((x*7) % 3)*4, h = 13 + ((x*13) % 5)*4; bldFar.push({ x, w, h }); x += w + 1; }
    x = 0;
    while (x < W - 8){
      const w = 10 + ((x*11) % 4)*5, h = 26 + ((x*17) % 6)*5;
      const wins = [];
      for (let wy = 4; wy < h - 4; wy += 5)
        for (let wx = 2; wx < w - 2; wx += 5)
          wins.push({ x:wx, y:wy, on:((x + wx + wy) % 7) < 3, ph:(x + wx + wy) % 97 });
      bldNear.push({ x, w, h, wins });
      x += w + 2;
    }
  })();

  const cacti = [{ x:38, y:74 }, { x:118, y:72 }, { x:198, y:75 }];

  /* draw helpers */
  function px(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

  function sky(){
    const bands = ['#050511','#08081C','#0B0B26','#0E0E30','#11113A','#141445'];
    const bh = Math.ceil(HORIZON / bands.length);
    for (let i = 0; i < bands.length; i++) px(0, i*bh, W, bh, bands[i]);
  }

  function moonAndStars(t){
    for (const s of stars){
      const a = .35 + .65 * (.5 + .5 * Math.sin(t * s.sp + s.ph));
      if (a < .18) continue;
      ctx.globalAlpha = a;
      px(s.x, s.y, 1, 1, s.g ? '#7CFF9E' : '#E8ECFF');
      if (s.big && a > .8){
        px(s.x-1, s.y, 1, 1, '#E8ECFF'); px(s.x+1, s.y, 1, 1, '#E8ECFF');
        px(s.x, s.y-1, 1, 1, '#E8ECFF'); px(s.x, s.y+1, 1, 1, '#E8ECFF');
      }
    }
    ctx.globalAlpha = 1;
    /* moon glow rings + disc + craters */
    for (let dy = -14; dy <= 14; dy++) for (let dx = -14; dx <= 14; dx++){
      const d = dx*dx + dy*dy;
      if (d <= 196 && d > 121) px(209+dx, 21+dy, 1, 1, 'rgba(240,234,200,0.045)');
      else if (d <= 121 && d > 64) px(209+dx, 21+dy, 1, 1, 'rgba(240,234,200,0.07)');
    }
    for (let dy = -8; dy <= 8; dy++) for (let dx = -8; dx <= 8; dx++){
      const d = dx*dx + dy*dy;
      if (d <= 64) px(209+dx, 21+dy, 1, 1, d > 50 ? '#EFE7BC' : '#F6F0CE');
    }
    px(205, 18, 3, 3, '#E3DAAE'); px(211, 23, 2, 2, '#E3DAAE'); px(213, 17, 2, 2, '#E3DAAE');
  }

  function shootStar(){
    if (!shoot.on){
      if (--shoot.next <= 0){
        shoot.on = true;
        shoot.x = 14 + Math.random() * 70; shoot.y = 5 + Math.random() * 14;
        shoot.vx = 2.4 + Math.random(); shoot.vy = .9 + Math.random() * .5;
        shoot.life = 26; shoot.next = 320 + Math.random() * 420;
      }
      return;
    }
    shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.life--;
    if (shoot.life <= 0 || shoot.x > W + 10){ shoot.on = false; return; }
    for (let i = 0; i < 7; i++){
      ctx.globalAlpha = (1 - i / 7) * .9;
      px(shoot.x - i * shoot.vx * .55, shoot.y - i * shoot.vy * .55, 1, 1, '#FFF6D8');
    }
    ctx.globalAlpha = 1;
  }

  function cactus(cx, cy){
    const c = '#0A1A10';
    px(cx, cy - 14, 3, 16, c);
    px(cx - 4, cy - 9, 4, 2, c); px(cx - 4, cy - 12, 2, 4, c);
    px(cx + 3, cy - 6, 4, 2, c); px(cx + 5, cy - 10, 2, 5, c);
  }

  const scenes = {
    mountain(t){
      px(0, HORIZON, W, H - HORIZON, '#0D0D2A');
      ridge1.forEach((h, i) => px(i*4, HORIZON - h, 4, h + 2, '#181840'));
      ridge2.forEach((h, i) => px(i*3, HORIZON + 6 - h, 3, h + 2, '#101031'));
      for (const tr of trees){
        const base = 88;
        px(tr.x + 1, base - tr.th - 2, 2, 2, '#04140C');
        for (let l = 0; l < 3; l++){
          const w = 2 + l * 2;
          px(tr.x + 2 - w/2, base - tr.th + l*3, w, 3, '#04140C');
        }
        px(tr.x + 1, base - 2, 2, 3, '#04140C');
      }
      px(0, GROUND, W, H - GROUND, '#08130D');
      px(0, GROUND, W, 2, '#0C1C12');
      for (let i = 0; i < 7; i++){
        const fx = (t*7 + i*37) % W;
        const fy = 70 + 6*Math.sin(t*.9 + i*2.1) - (i % 3)*4;
        const a = .4 + .6*Math.sin(t*1.4 + i*1.7);
        if (a > .45){ ctx.globalAlpha = a; px(fx, fy, 1, 1, '#8CFF7A'); ctx.globalAlpha = 1; }
      }
    },
    city(t){
      px(0, HORIZON, W, H - HORIZON, '#10102B');
      for (const b of bldFar) px(b.x, HORIZON - b.h, b.w, b.h, '#191940');
      for (const b of bldNear){
        px(b.x, HORIZON - b.h, b.w, b.h - 3, '#0A0A24');
        px(b.x, HORIZON - b.h, b.w, 3, '#0A0A24');
        if (b.h > 44){
          px(b.x + (b.w >> 1), HORIZON - b.h - 5, 1, 5, '#0A0A24');
          if (Math.sin(t*2.4) > 0) px(b.x + (b.w >> 1), HORIZON - b.h - 7, 1, 1, '#FF5A66');
        }
        for (const w of b.wins){
          const off = (((t * .5) | 0) + w.ph) % 13 === 0;
          if (w.on && !off) px(b.x + w.x, HORIZON - b.h + w.y, 2, 2, ((w.x + w.y) % 2) ? '#FFD866' : '#6BF79B');
        }
      }
      px(0, GROUND, W, H - GROUND, '#05050F');
      px(0, GROUND, W, 2, '#0A0A1C');
    },
    desert(t){
      px(0, HORIZON, W, H - HORIZON, '#1A1233');
      for (let x = 0; x < W; x++){
        const y1 = 56 + Math.round(6*Math.sin(x*.045) + 4*Math.sin(x*.013 + 3));
        px(x, y1, 1, H - y1, '#241B42');
        const y2 = 68 + Math.round(5*Math.sin(x*.03 + 1.6) + 3*Math.sin(x*.09 + .4));
        px(x, y2, 1, H - y2, '#171029');
        const y3 = 79 + Math.round(3*Math.sin(x*.05 + 4));
        px(x, y3, 1, H - y3, '#0C0817');
      }
      for (const c of cacti) cactus(c.x, c.y);
      for (let i = 0; i < 8; i++){
        const sx = (t*26 + i*33) % W;
        const sy = 60 + ((i*13) % 22);
        ctx.globalAlpha = .25 + .2 * Math.sin(t*1.2 + i);
        px(sx, sy, 2, 1, '#3A2E5C');
      }
      ctx.globalAlpha = 1;
      px(0, 88, W, H - 88, '#080512');
    }
  };

  /* scene buttons */
  $$('.scene-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.scene === scene);
    b.onclick = () => {
      scene = b.dataset.scene;
      localStorage.setItem(K.scene, scene);
      $$('.scene-btn').forEach(x => x.classList.toggle('active', x === b));
    };
  });

  function frame(now){
    const t = now / 1000;
    sky();
    moonAndStars(t);
    shootStar();
    scenes[scene](t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ================= BOOT ================= */
$('#year').textContent = new Date().getFullYear();
applyTheme();
render();
window.addEventListener('hashchange', render);
</script>

<script>
/* ================= LIVE SYNC ENGINE =================
   Anything saved from the devanshu id — projects, theme colors, logo,
   account changes — is stamped with a version number (uf_ver). Every
   other open page of the website detects the new version through three
   layers and re-renders itself automatically:
     1. BroadcastChannel  → instant (same browser, other tabs)
     2. storage event     → instant fallback (same browser, other tabs)
     3. 1-second heartbeat → guaranteed catch-up, at most 1s behind
   Typing is never interrupted, and your scroll position is kept. */
(function(){
  function routeName(){
    return (location.hash.replace(/^#/, '') || '/').split('/').filter(Boolean)[0] || '';
  }

  function pullRemote(){
    users    = store.get(K.users, users);
    projects = store.get(K.projects, projects);
    theme    = store.get(K.theme, theme);
    favs     = store.get(K.favs, favs);
    const sess = store.get(K.session, null);
    currentUser = sess ? (users.find(u => u.u === sess) || null) : null;
    applyTheme();
  }

  function renderLive(){
    const ae = document.activeElement;
    if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return; /* never interrupt typing */
    const r = routeName();
    if (r === 'admin' || r === 'login' || r === 'signup') return; /* forms own these screens */
    const qEl = $('#q');
    const qv  = qEl ? qEl.value : '';
    const y   = window.scrollY;
    render();
    if (qv && $('#q')){ $('#q').value = qv; $('#q').dispatchEvent(new Event('input')); }
    window.scrollTo(0, y);
  }

  function flashChip(){
    const chip = document.getElementById('liveChip');
    if (!chip) return;
    chip.classList.add('hit');
    setTimeout(() => chip.classList.remove('hit'), 1200);
  }

  function onRemote(announce){
    lastVer = store.get(K.ver, 0);
    pullRemote();
    renderLive();
    if (announce){ toast('Live update applied'); flashChip(); }
  }

  /* layer 1 + 2: instant signals from other tabs of this browser */
  if (bc) bc.onmessage = () => onRemote(true);
  window.addEventListener('storage', e => {
    if (e.key === null || e.key === K.ver) onRemote(true);
  });

  /* layer 3: guaranteed 1-second heartbeat */
  setInterval(() => {
    const v = store.get(K.ver, 0);
    if (v !== lastVer) onRemote(false);
  }, 1000);

  /* catch up the moment a background tab becomes visible again */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden){
      const v = store.get(K.ver, 0);
      if (v !== lastVer) onRemote(false);
    }
  });
})();
</script>
